:root{--porcelain:#FAF9F7;--powder:#F0E7E6;--ink:#171616;--stone:#8B8483;--line:#E1D8D6;--marsala:#7A2638;
--display:"Playfair Display",Didot,"Bodoni 72",Georgia,serif;--body:"Jost","Futura","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--porcelain);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{width:100%;max-width:820px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}
.bar{padding-top:18px;padding-bottom:18px}
.logo{font-family:var(--display);font-size:22px;letter-spacing:.02em;color:var(--ink);text-decoration:none}
main{flex:1;display:flex;align-items:center}
.box{padding-top:56px;padding-bottom:72px}
.code{font-family:var(--display);font-size:clamp(96px,22vw,180px);line-height:1;color:var(--marsala);margin:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,42px);line-height:1.2;margin:16px 0 10px}
p{margin:0 0 28px;color:var(--stone);max-width:520px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:999px;background:var(--ink);color:var(--porcelain);text-decoration:none;font-size:13px;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--ink)}
.btn.line{background:transparent;color:var(--ink)}
.btn:hover{background:var(--marsala);border-color:var(--marsala);color:#fff}
footer{border-top:1px solid var(--line);padding:22px 0 30px;color:var(--stone);font-size:14px}
footer a{color:var(--stone)}
@media (max-width:560px){body{font-size:16px}.btn{flex:1 1 100%}}
</style>
</head>
<body>
<header><div class="wrap bar"><a class="logo" href="/" data-home>Лидия Сучкова</a></div></header>
